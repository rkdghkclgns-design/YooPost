<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>fake SmartEditor ONE</title>
  <style>
    .layer { display: none; }
    .layer.open { display: block; }
    .se-text-paragraph { min-height: 24px; border: 1px solid #ccc; padding: 4px; margin: 4px 0; }
  </style>
</head>
<body>
  <!-- "작성 중인 글이 있습니다" 팝업 흉내 -->
  <button class="se-popup-button-cancel" id="draftPopup">취소</button>

  <div class="se-documentTitle"><div class="se-text-paragraph" contenteditable="true" id="title"></div></div>
  <div id="body">
    <div class="se-component se-text"><div class="se-text-paragraph" contenteditable="true"></div></div>
  </div>

  <button class="se-image-toolbar-button" id="imgBtn">사진</button>
  <button class="se-property-toolbar-drop-down-button se-align-left-toolbar-button"
          data-name="align-drop-down-with-justify" id="alignDrop">정렬</button>
  <div class="layer" id="alignLayer">
    <button class="se-toolbar-option-icon-button se-toolbar-option-align-center-button"
            data-name="align-drop-down-with-justify" data-value="center" id="alignCenter">가운데 정렬</button>
  </div>
  <input type="file" id="file" accept="image/*" style="display:none">
  <button class="publish_btn__m9KHH" id="publish">발행</button>
  <button class="save_btn__bzc5B" id="save">저장</button>

  <div class="layer" id="layer">
    <input class="tag_input__rvUB5" id="tag">
    <button class="confirm_btn__WEaBq" id="confirm">발행하기</button>
  </div>

  <script>
    const body = document.getElementById('body');
    const images = [];
    const tags = [];

    document.getElementById('draftPopup').onclick = (e) => e.target.remove();
    document.getElementById('imgBtn').onclick = () => document.getElementById('file').click();
    document.getElementById('file').onchange = (e) => {
      const name = e.target.files[0].name;
      images.push(name);
      setTimeout(() => {  // 업로드 지연 흉내
        const img = document.createElement('div');
        img.className = 'se-component se-image';
        img.textContent = '[IMG:' + name + ']';
        body.appendChild(img);
        const text = document.createElement('div');
        text.className = 'se-component se-text';
        text.innerHTML = '<div class="se-text-paragraph" contenteditable="true"></div>';
        body.appendChild(text);
        e.target.value = '';
      }, 300);
    };
    document.getElementById('publish').onclick = () => document.getElementById('layer').classList.add('open');
    document.getElementById('alignDrop').onclick = () => document.getElementById('alignLayer').classList.add('open');
    document.getElementById('alignCenter').onclick = () => {
      body.dataset.align = 'center';
      document.getElementById('alignLayer').classList.remove('open');
    };
    document.getElementById('tag').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { tags.push(e.target.value); e.target.value = ''; e.preventDefault(); }
    });

    function summary() {
      return JSON.stringify({
        title: document.getElementById('title').innerText,
        body: body.innerText,
        tags: tags,
        images: images,
        align: body.dataset.align || 'left',
      });
    }
    document.getElementById('confirm').onclick = () => {
      localStorage.setItem('summary', summary());
      if (new URLSearchParams(location.search).has('noredirect')) {
        return;  // 발행은 됐지만 주소가 바뀌지 않는 상황 흉내
      }
      location.href = 'done.html?blogId=myblog&logNo=223456789012';
    };
    document.getElementById('save').onclick = () => localStorage.setItem('saved', summary());
  </script>
</body>
</html>
