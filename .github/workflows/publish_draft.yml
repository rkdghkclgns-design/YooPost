name: AI백과사전 원고 발행 (슬랙 ✅ 승인)
# Claude 가 쓴 원고 메시지에 슬랙에서 ✅ 를 누르면 Cloudflare Worker 가 이 워크플로를 실행한다.
# AI(구글 API)를 쓰지 않는다 — 원고 보관함에서 발행용 HTML 을 꺼내 구글 블로그에 올리고 결과를 슬랙 스레드에 남긴다.
# 시크릿은 production 환경(main 브랜치만 사용 가능)에 있다. Worker 는 main 으로 실행한다.
run-name: "${{ inputs.check_only && '🔎 시크릿 점검 (발행 안 함)' || format('✅ 승인 발행 · {0}', inputs.draft_id) }}"

on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: "원고 ID (슬랙 원고 메시지에 표시)"
        type: string
        required: true
      approved_by:
        description: "승인한 슬랙 사용자 ID (Worker 가 자동 입력)"
        type: string
        default: ""
      check_only:
        description: "시크릿 점검만 (발행 안 함, 슬랙 알림 없음) — 원고 ID 는 아무 값"
        type: boolean
        default: false

concurrency:
  group: publish-draft
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # 발행 뒤 cloud_drafts.yml 실행 (알림 채널 진행 막대·수동 지시 카드 갱신)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      BLOG_NAME: ${{ vars.BLOG_NAME }}
      IMAGE_HOST_URL: ${{ vars.IMAGE_HOST_URL }}
      SLACK_CHANNEL_PUBLISH: ${{ vars.SLACK_CHANNEL_PUBLISH }}
      SLACK_CHANNEL_MANUAL: ${{ vars.SLACK_CHANNEL_MANUAL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      IMAGE_UPLOAD_TOKEN: ${{ secrets.IMAGE_UPLOAD_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시크릿 점검 (check_only — 값은 표시하지 않음)
        if: ${{ inputs.check_only }}
        run: |
          missing=""
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN BLOGGER_BLOG_ID \
                      IMAGE_UPLOAD_TOKEN SLACK_BOT_TOKEN SLACK_CHANNEL_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::비어 있는 시크릿:$missing"; exit 1; fi
          echo "발행에 필요한 시크릿 7개가 모두 들어 있습니다 (production 환경)"

      - name: 원고 발행
        if: ${{ !inputs.check_only }}
        env:
          # 외부 입력은 run 스크립트에 직접 넣지 않고 환경변수로만 전달 (스크립트 인젝션 방지)
          DRAFT_ID: ${{ inputs.draft_id }}
          APPROVED_BY: ${{ inputs.approved_by }}
        run: python -m autopost.publish_draft

      - name: 알림 채널 진행 막대·수동 지시 카드 갱신
        if: ${{ !inputs.check_only && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloud_drafts.yml --repo "$GITHUB_REPOSITORY" --ref main -f note="발행 반영" || echo "::warning::갱신 실행을 요청하지 못했습니다"
