# YooPost 워크스페이스용 슬랙 앱 매니페스트
# https://api.slack.com/apps → Create New App → From an app manifest → 워크스페이스 'YooPost' 선택 → 아래 내용 붙여넣기
# ※ url 은 배포된 Cloudflare Worker 주소 (다른 계정에 배포하면 wrangler deploy 출력 주소로 바꾸세요)
display_information:
  name: YooPost
  description: AI백과사전 — 구글 블로그 AI 자동 포스팅을 슬랙에서 제어합니다
  background_color: "#0d47a1"
features:
  bot_user:
    display_name: yoopost
    always_online: true
  slash_commands:
    - command: /aipost
      url: https://yoopost-slack-relay.cleaning-autopost-slack-relay.workers.dev/
      description: Claude 에게 원고 지시 (예 "주제를 AI도구에 발행해줘" · "전체 새로운 포스트로 재발행")
      usage_hint: "[지시]  ·  도움말"
      should_escape: false
    - command: /aipost-setup
      url: https://yoopost-slack-relay.cleaning-autopost-slack-relay.workers.dev/
      description: 구글 블로그·이미지·원고 보관함·슬랙 연동 상태 점검
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - files:write
      # scripts/setup_slack_channels.py 가 yoopost-* 채널을 만들고 나를 초대하는 데 사용
      - channels:manage
      - channels:read
      # 채널 정리 스크립트가 봇이 빠진 공개 채널에 다시 참여할 때 사용
      - channels:join
      - users:read
      - users:read.email
      # 원고 메시지의 ✅ 반응을 감지해 발행 (Worker /slack/events)
      - reactions:read
      # #yoopost-0-수동지시 채널에 쓴 지시를 읽음 (Worker 가 그 채널 메시지만 처리)
      - channels:history
settings:
  event_subscriptions:
    request_url: https://yoopost-slack-relay.cleaning-autopost-slack-relay.workers.dev/slack/events
    bot_events:
      - reaction_added
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
