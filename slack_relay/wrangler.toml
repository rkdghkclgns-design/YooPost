name = "yoopost-slack-relay"
main = "entry.js"
compatibility_date = "2025-01-01"

[vars]
# 깃허브아이디/리포지토리명
GITHUB_REPO = "rkdghkclgns-design/YooPost"
# 실행할 워크플로 파일과 브랜치
GITHUB_WORKFLOW = "auto_post.yml"
GITHUB_REF = "main"
# (선택) 실행 허용할 슬랙 사용자 ID, 쉼표로 구분. 비우면 채널의 누구나 실행 가능 (✅ 승인·수동 지시·/aipost 모두)
ALLOWED_USER_IDS = "U0C4PLGBNF9"
# 수동 지시 채널 #yoopost-0-수동지시 (scripts/setup_slack_channels.py 가 만든 채널 ID) — 이 채널의 새 메시지만 지시로 받는다
MANUAL_CHANNEL_ID = "C0C50SP7VV5"
MANUAL_WORKFLOW = "manual_request.yml"
AUTO_APPROVE_ENABLED = "true"
CODEX_FALLBACK_ENABLED = "true"
WATCHDOG_CHANNEL_ID = "C0C4ZUG0TC5"

[triggers]
crons = ["*/5 * * * *"]

# 원고마다 60초 자동 승인·수동 지시마다 15분 미시작 확인 — PC 전원과 무관하게 실행한다.
[[durable_objects.bindings]]
name = "DRAFT_APPROVAL"
class_name = "DraftApproval"

[[durable_objects.bindings]]
name = "CLOUD_WATCHDOG"
class_name = "CloudWatchdog"

[[migrations]]
tag = "v1-draft-approval"
new_sqlite_classes = ["DraftApproval"]

[[migrations]]
tag = "v2-cloud-watchdog"
new_sqlite_classes = ["CloudWatchdog"]

# 블로그 이미지(대표 이미지·인용 이미지) 저장소 — 구글 드라이브 대신 Cloudflare KV (무료 한도: 쓰기 1,000회/일)
[[kv_namespaces]]
binding = "IMAGES"
id = "53229d50799747a3b4b53d4a14d47dd6"

# 시크릿은 파일에 적지 말고 아래 명령으로 등록하세요:
#   npx wrangler secret put SLACK_SIGNING_SECRET
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put IMAGE_UPLOAD_TOKEN   (python scripts/image_host_secret.py 가 만들어 등록)
